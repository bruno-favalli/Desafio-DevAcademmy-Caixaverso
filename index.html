<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/estilo.css" />
    <title>DevAcademy</title>
  </head>
  <body>
    <header class="main-nav">
      <div class="nav-content">
        <h1>DevAcademy</h1>
        <button
          class="hamburger"
          id="btnMenu"
          aria-expanded="false"
          aria-label="Abrir Menu"
        >
          <span class="line"></span>
          <span class="line"></span>
          <span class="line"></span>
        </button>
        <nav id="menuLinks" class="nav-links">
          <ul>
            <li><a href="#">Cursos</a></li>
            <li><a href="#">Mentoria</a></li>
            <li><a href="#">Comunidade</a></li>
            <li><a href="#">Entrar</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="cursos-container">
      <section class="header-filter">
        <div class="filter-group">
          <input
            type="text"
            id="filterInput"
            placeholder="Buscar tecnologia (ex: TypeScript)"
            aria-label="Filtrar planos"
          />
        </div>
      </section>

      <div id="planosGrid" class="planos-grid">
        <p class="voltar">Carregando as melhores ofertas para você...</p>
      </div>
    </main>

    <footer class="footer">
      <div class="footer-container">
        <div class="footer-column">
          <h2 class="footer-logo">
            <span class="footer-dev">Dev</span>Academy
          </h2>
          <p class="footer-description">
            Acelerando carreiras tech com foco no que o mercado realmente pede.
          </p>
        </div>

        <div class="footer-column">
          <h3 class="footer-title">EXPLORAR</h3>
          <ul class="footer-links">
            <li><a href="#">Cursos</a></li>
            <li><a href="#">Mentoria</a></li>
            <li><a href="#">Comunidade</a></li>
          </ul>
        </div>

        <div class="footer-column">
          <h3 class="footer-title">NEWSLETTER</h3>
          <form class="newsletter-form">
            <input type="email" placeholder="E-mail" class="newsletter-input" />
            <button type="submit" class="newsletter-button">OK</button>
          </form>
        </div>
      </div>
    </footer>

    <script type="module" src="./src/js/script.js"></script>
  </body>
</html>
